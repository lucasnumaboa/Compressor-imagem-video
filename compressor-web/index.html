<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compressor Manero - Comprima Imagens e Vídeos</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header">
      <i class="fas fa-compress-alt logo-icon"></i>
      <h1>Compressor Manero</h1>
    </div>
    
    <div class="tabs">
      <button class="tab-btn active" data-tab="image">Comprimir Imagem</button>
      <button class="tab-btn" data-tab="video">Comprimir Vídeo</button>
    </div>
    
    <div class="tab-content active" id="image-tab">
      <h2>Compressor de Imagens</h2>
      <div class="upload-container">
        <label for="image-upload" class="upload-label">
          <span>Selecione ou arraste uma imagem</span>
          <input type="file" id="image-upload" accept="image/*" hidden>
        </label>
      </div>
      <div class="settings">
        <div class="setting">
          <label for="image-quality">Qualidade:</label>
          <input type="range" id="image-quality" min="1" max="100" value="80">
          <span id="image-quality-value">80%</span>
        </div>
        <div class="setting">
          <label for="image-max-width">Largura máxima:</label>
          <input type="number" id="image-max-width" min="100" max="4000" value="1920">
        </div>
      </div>
      <button id="compress-image-btn" class="compress-btn" disabled>Comprimir Imagem</button>
      <div class="result" id="image-result"></div>
    </div>
    
    <div class="tab-content" id="video-tab">
      <h2>Compressor de Vídeos</h2>
      <div class="upload-container">
        <label for="video-upload" class="upload-label">
          <span>Selecione ou arraste um vídeo</span>
          <input type="file" id="video-upload" accept="video/*" hidden>
        </label>
      </div>
      <div class="settings">
        <div class="setting">
          <label for="video-quality">Qualidade:</label>
          <select id="video-quality">
            <option value="high">Alta (1080p)</option>
            <option value="medium" selected>Média (720p)</option>
            <option value="low">Baixa (480p)</option>
          </select>
        </div>
        <div class="setting">
          <label for="video-crf">Taxa de compressão (CRF):</label>
          <input type="range" id="video-crf" min="18" max="28" value="23">
          <span id="video-crf-value">23</span>
        </div>
      </div>
      <button id="compress-video-btn" class="compress-btn" disabled>Comprimir Vídeo</button>
      <div class="result" id="video-result"></div>
    </div>
    
    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>
      <div class="progress-text" id="progress-text"></div>
    </div>
  </div>
  
  <footer>
    <p>Compressor de Imagens e Vídeos Online - Compressão realizada diretamente no navegador</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.10.1/dist/ffmpeg.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
